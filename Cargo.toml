[workspace]
resolver = "3"
members = [
  "crates/plainly-core",
  "crates/plainly-cli",
  "crates/plainly-panel",
  "crates/plainly-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
plainly-core = { path = "crates/plainly-core" }

async-channel = "2"
clap = { version = "4", features = ["derive"] }
# GTK3 plus the wlroots layer-shell protocol: the panel is a layer surface, so
# it is a GTK process rather than a Tauri one. `v0_6` is the protocol version
# `keyboard_mode=NONE` needs, which is what keeps the panel from taking focus.
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
keyring = "4"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
# `bundled` compiles SQLite (FTS5 included) into the binary and links it
# statically: a machine needs a C compiler, not a system libsqlite3, which is
# what keeps the CLI as free of runtime libraries as it is of GTK.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml_edit = { version = "0.22", features = ["serde"] }
# A blocking client on purpose: v0 does not stream (spec §7), so an async stack
# would buy nothing but weight. rustls with its own bundled roots also keeps the
# CLI free of a runtime libssl, the way it is free of GTK.
ureq = { version = "3.4", features = ["json"] }
# The compositor's registry, for the panel's capability decision, and the
# clipboard read a layer surface needs because GTK's own API wants focus:
# `wl-clipboard-rs` speaks data-control, on the same wayland-client.
wayland-client = "0.31"
wl-clipboard-rs = "0.9"

[profile.release]
strip = true
