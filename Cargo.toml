[workspace]
resolver = "3"
members = [
  "crates/plainly-core",
  "crates/plainly-cli",
  "crates/plainly-panel",
  "crates/plainly-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
plainly-core = { path = "crates/plainly-core" }

clap = { version = "4", features = ["derive"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml_edit = { version = "0.22", features = ["serde"] }

[profile.release]
strip = true
