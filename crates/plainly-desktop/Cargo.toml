[package]
name = "plainly-desktop"
description = "The Tauri main window: history, search, settings, export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A library as well as a binary: everything the window *decides* — which Records
# a search means, what the settings page shows, where an export lands — is
# reachable from a test without a display, and `src/commands.rs` is only the
# translation of those calls into Tauri's calling convention.
[lib]
name = "plainly_desktop"
path = "src/lib.rs"

[[bin]]
name = "plainly-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7.1"

[dependencies]
plainly-core.workspace = true

# The window itself (spec §13). Tauri cannot draw a layer surface, but an
# ordinary window is what it is for.
tauri = "2.12.1"

# The same GTK3 the panel is built on, and already in this binary's closure
# through Tauri's `tao`; the dependency is direct for one call. WebKitGTK reads
# GDK's screen resolution to derive the device pixel ratio, GDK leaves that
# resolution at `-1` in a session with no XSettings daemon (niri, sway), and the
# resulting ratio lays the whole interface out on a viewport 96 times too wide
# — see `window::screen_dpi`.
gtk.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `tauri-plugin-single-instance` is the plugin the spec names, but it is not
# reachable here, so the handover is spoken directly: an `flock` lock file in the
# session's runtime directory decides who is the window, and a socket beside it
# carries the request. No dependency is involved either way; `single.rs` owns the
# design.

# One syscall, for the one thing the standard library will not answer: the
# process's own user id, which names the fallback socket when a session has no
# `XDG_RUNTIME_DIR`. It is already in the graph through the keyring.
libc = "0.2"

# The compositor's registry decides whether "explain on copy" can be offered at
# all (spec §12, §13). The clipboard itself is *written* through `wl-copy`.
wayland-client.workspace = true

# The listener *reads* it, and a window cannot: `--watch` has no surface and no
# focus, and taking focus on every copy is the opposite of what the feature is
# for. `watch::Watcher` is the part the panel does not need, because a panel is
# spawned *by* a copy rather than watching for one.
wl-clipboard-rs.workspace = true
