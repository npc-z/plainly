# Plainly configuration.
#
# Hand-editable on purpose: keep it in your dotfiles, diff it, comment it.
# `plainly config set <key> <value>` edits this file in place and keeps your
# comments; `plainly config show` prints the effective values.

[app]
# Which provider Plainly talks to. Presets ship for deepseek, openai,
# llamacpp, ollama and lmstudio; anything you add lives under [providers.*].
provider = "deepseek"

# The level for the Comprehensible English section: A1, A2, B2 or C1.
level = "B2"

# The learner's first language, and the target of the Translation section.
# A setting, never inferred at runtime.
native_language = "Chinese"

# Default shape for `plainly history export`: markdown or raw.
export_format = "markdown"

# Language of the interface itself. The Explanation's sections stay English.
ui_language = "zh-CN"

# Which sections the panel shows. Display only: the prompt always asks for all
# four fields, so toggling these never changes the prompt version and never
# invalidates a stored Explanation.
show_original = true
show_comprehensible = true
show_glosses = true
show_grammar = true
show_translation = true

# Where the panel appears. `panel_corner` is one of top-left, top-right,
# bottom-left, bottom-right; `panel_display` is "current" — follow the output
# the pointer is on — or the name of one output, which is the compositor's
# connector name (`eDP-1`, `DP-2`). The main window writes "output-1", "output-2"
# for a display it can count but not name: `wl_output` carries a make and a model
# and the connector name comes from the `xdg-output` protocol, which v0 does not
# speak. Until the panel's positioning ticket lands, both keys are written and
# nothing reads them yet.
panel_corner = "top-left"
panel_display = "current"

# How wide the panel is, and how tall it may become, in pixels. The width is the
# panel's width; the height is a ceiling rather than a size, because the panel is
# a note and not a window: a short Passage still gets a short panel, and what
# this caps is the long one, which then scrolls its body. Both are held inside
# the screen whatever they say, and the settings screen refuses anything outside
# 320..900 wide and 240..1200 tall. `plainly config set` refuses that same range
# too, so only a hand edit gets a value outside it into the file.
panel_width = 470
panel_height = 470

# Auto-dismiss is two independent keys on purpose. Never express "off" as a
# duration of 0: "off" already has a switch, and two spellings drift apart.
panel_autohide = false
panel_autohide_seconds = 20

# Pop the panel when the clipboard changes. Off by default, and it needs two
# things: a compositor that speaks the data-control protocol, and the listener
# that watches the clipboard. The listener is not this window -- start it with
# `plainly-desktop --watch` (or a desktop autostart entry that runs it), and the
# switch is what tells that process whether to act. Off means nothing is
# resident, which is why the listener is a separate launch rather than something
# this file can start on its own.
copy_auto_popup = false

# One table per provider you configure. Anything you leave out falls back to
# the shipped preset for that name: deepseek, openai, llamacpp, ollama, lmstudio.
#
#   [providers.deepseek]
#   endpoint = "https://api.deepseek.com/v1"
#   model = "deepseek-flash"
#   thinking = "off"      # "off" is the default, and roughly 10x faster
#
# The endpoint is a base URL: Plainly appends /chat/completions to it. A name
# that is not one of the presets needs both keys here, since there is nothing to
# fall back to. The local runtimes (llamacpp, ollama, lmstudio) also need a model:
# only your machine knows what it has loaded, and naming one that is not there
# would be worse than asking.

[providers]

[prompts]
# Appended to the shipped system prompt. Append-only: your rules come after the
# factory rules and cannot delete them -- the factory rules are what keep two
# people's histories comparable.
appendix = ""

# Per-level wording handed to the model next to the level label. Empty means
# "use the shipped descriptors". This is prompt data, not a setting: changing a
# descriptor changes the prompt version, so it cannot silently reuse a stored
# Explanation that was generated under the old wording.
[prompts.level_descriptors]
