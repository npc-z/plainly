# Generated by scripts/generate-cli-workspace.sh from the root workspace's manifests.
# Do not edit by hand; run the generator instead.

[workspace]
resolver = "3"
members = [
  "crates/plainly-core",
  "crates/plainly-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
plainly-core = { path = "crates/plainly-core" }
clap = { version = "4", features = ["derive"] }
keyring = "4"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml_edit = { version = "0.22", features = ["serde"] }
ureq = { version = "3.4", features = ["json"] }
